<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTTP Dogs 🐶</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="page">
    <section class="app-card">

      <header class="hero">
        <div class="paw">🐾</div>
        <h1> puppy luv! 🐶</h1>
        <p>Meet Your Next Favorite Pup!</p>
      </header>

      <button id="generate-btn" type="button">
        Generate Another Dog ✨
      </button>

      <p id="status-code">HTTP 201 — Created</p>

      <div class="image-frame">
        <img
          id="dog-image"
          src="https://http.dog/201.jpg"
          alt="HTTP 201 dog"
        >
      </div>

      <p id="message" role="status" aria-live="polite"></p>

      <footer>
       🐾 Every Pup Deserves Some Love!
      </footer>

    </section>
  </main>

</body>
</html>
